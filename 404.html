<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404, сторінку не знайдено</title>
<script>
  // the site lives in /ZamotVlad/ on github.io and at the root on a custom domain
  var base = location.hostname.endsWith("github.io") ? "/ZamotVlad/" : "/";
  document.write('<link rel="icon" href="' + base + 'favicon.svg" type="image/svg+xml">');
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@600&family=JetBrains+Mono&display=swap">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1d1a17; color: #ece5d8; font: 400 1rem/1.6 "JetBrains Mono", ui-monospace, monospace; padding: 24px; box-sizing: border-box; }
  main { max-width: 520px; display: grid; gap: 16px; }
  h1 { font: 600 clamp(2rem, 6vw, 3rem)/1.1 "Geologica", system-ui, sans-serif; margin: 0; }
  code { color: #a89f90; }
  b { color: #d6a874; font-weight: 500; }
  a { color: #d6a874; }
</style>
</head>
<body>
<main>
  <code>GET <span id="p">/</span> <b>404</b></code>
  <h1>Такої сторінки немає</h1>
  <p>Page not found. <a id="home" href="/ZamotVlad/">На головну / Back home</a></p>
</main>
<script>
  document.getElementById("p").textContent = location.pathname;
  document.getElementById("home").href = base;
</script>
</body>
</html>
